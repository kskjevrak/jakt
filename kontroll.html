<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontrollkart jaktfelt</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; top: 12px; left: 12px; max-width: 340px; background: rgba(255,255,255,.92);
           padding: 12px 14px; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  #panel h1 { font-size: 15px; margin: 0 0 6px; }
  #panel p { margin: 4px 0; }
  .sw { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px; border: 1px solid #0003; }
  #click { position: absolute; bottom: 12px; left: 12px; background: rgba(255,255,255,.92); padding: 8px 12px;
           border-radius: 8px; font-family: ui-monospace, monospace; font-size: 13px; }
  label { display: block; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Kontrollkart – jaktfelt Bygland</h1>
  <p id="info">Laster …</p>
  <p><span class="sw" style="background:#2e7d3233;border-color:#2e7d32"></span>Jaktfelt (49/1, 49/2, 49/3, 49/4, 50/1)</p>
  <p><span class="sw" style="background:#c6282833;border-color:#c62828"></span>Naboteiger innen 500 m</p>
  <p><span class="sw" style="background:transparent;border:1px dashed #555"></span>Prosesseringsområde (AOI)</p>
  <p><span class="sw" style="background:#1565c0;border-radius:50%"></span>Startpunkt fra <code>config/start.json</code></p>
  <label><input type="checkbox" id="matrikkel"> Vis Kartverkets matrikkelkart (WMS, sannhetslag)</label>
  <label><input type="checkbox" id="labels" checked> Vis gnr/bnr</label>
</div>
<div id="click">Klikk i kartet for koordinater</div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources: {
      topo: { type: 'raster', tileSize: 256, attribution: '© Kartverket',
        tiles: ['https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png'] },
      matrikkel: { type: 'raster', tileSize: 256,
        tiles: ['https://wms.geonorge.no/skwms1/wms.matrikkelkart?service=WMS&version=1.3.0&request=GetMap&layers=matrikkelkart&styles=&crs=EPSG:3857&bbox={bbox-epsg-3857}&width=256&height=256&format=image/png&transparent=true'] },
      jaktfelt: { type: 'geojson', data: 'data/jaktfelt.geojson' },
      teiger: { type: 'geojson', data: 'data/teiger.geojson' },
      nabo: { type: 'geojson', data: 'data/naboteiger.geojson' },
      aoi: { type: 'geojson', data: 'data/aoi.geojson' },
      start: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
    },
    layers: [
      { id: 'topo', type: 'raster', source: 'topo' },
      { id: 'matrikkel', type: 'raster', source: 'matrikkel', layout: { visibility: 'none' }, paint: { 'raster-opacity': 0.8 } },
      { id: 'nabo-fill', type: 'fill', source: 'nabo', paint: { 'fill-color': '#c62828', 'fill-opacity': 0.18 } },
      { id: 'nabo-line', type: 'line', source: 'nabo', paint: { 'line-color': '#c62828', 'line-width': 1 } },
      { id: 'jakt-fill', type: 'fill', source: 'jaktfelt', paint: { 'fill-color': '#2e7d32', 'fill-opacity': 0.18 } },
      { id: 'teig-line', type: 'line', source: 'teiger', paint: { 'line-color': '#2e7d32', 'line-width': 1, 'line-dasharray': [2, 2] } },
      { id: 'jakt-line', type: 'line', source: 'jaktfelt', paint: { 'line-color': '#1b5e20', 'line-width': 2.5 } },
      { id: 'aoi-line', type: 'line', source: 'aoi', paint: { 'line-color': '#555', 'line-width': 1.5, 'line-dasharray': [3, 3] } },
      { id: 'teig-label', type: 'symbol', source: 'teiger', filter: ['>', ['get', 'areal_ha'], 5],
        layout: { 'text-field': ['get', 'gnr_bnr'], 'text-size': 12, 'text-font': ['Open Sans Regular'] },
        paint: { 'text-color': '#1b5e20', 'text-halo-color': '#fff', 'text-halo-width': 1.5 } },
      { id: 'nabo-label', type: 'symbol', source: 'nabo', filter: ['>', ['get', 'areal_ha'], 5],
        layout: { 'text-field': ['get', 'matrikkelnummer'], 'text-size': 11, 'text-font': ['Open Sans Regular'] },
        paint: { 'text-color': '#b71c1c', 'text-halo-color': '#fff', 'text-halo-width': 1.5 } },
      { id: 'start-pt', type: 'circle', source: 'start', paint: { 'circle-radius': 7, 'circle-color': '#1565c0', 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } },
      { id: 'start-label', type: 'symbol', source: 'start', layout: { 'text-field': ['get', 'navn'], 'text-offset': [0, 1.3], 'text-size': 12, 'text-font': ['Open Sans Regular'] },
        paint: { 'text-color': '#0d47a1', 'text-halo-color': '#fff', 'text-halo-width': 1.5 } },
    ],
  },
  center: [7.72, 58.785], zoom: 12, maxPitch: 0,
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.ScaleControl({ maxWidth: 160 }));

map.on('load', async () => {
  const jf = await (await fetch('data/jaktfelt.geojson')).json();
  const p = jf.features[0].properties;
  const b = new maplibregl.LngLatBounds();
  (function walk(c) { if (typeof c[0] === 'number') b.extend(c); else c.forEach(walk); })(jf.features[0].geometry.coordinates);
  map.fitBounds(b, { padding: 40, duration: 0 });
  document.getElementById('info').textContent =
    `${p.areal_ha} ha, ${p.antall_teiger} teiger (${p.antall_festeteiger} feste). ${p.merknad ? 'Merknad: ' + p.merknad : ''}`;
  const st = await (await fetch('config/start.json')).json();
  map.getSource('start').setData({ type: 'FeatureCollection', features: st.startpunkter
    .filter(s => s.lat != null).map(s => ({ type: 'Feature', properties: { navn: s.navn }, geometry: { type: 'Point', coordinates: [s.lon, s.lat] } })) });
});
map.on('click', e => {
  const f = map.queryRenderedFeatures(e.point, { layers: ['teig-line', 'jakt-fill', 'nabo-fill'] })[0];
  const t = f ? ` · ${f.properties.gnr_bnr || f.properties.matrikkelnummer || ''} ${f.properties.bruksnavn || ''}` : '';
  document.getElementById('click').textContent = `lat ${e.lngLat.lat.toFixed(5)}, lon ${e.lngLat.lng.toFixed(5)}${t}`;
});
document.getElementById('matrikkel').onchange = e => map.setLayoutProperty('matrikkel', 'visibility', e.target.checked ? 'visible' : 'none');
document.getElementById('labels').onchange = e => ['teig-label', 'nabo-label'].forEach(l => map.setLayoutProperty(l, 'visibility', e.target.checked ? 'visible' : 'none'));
</script>
</body>
</html>
